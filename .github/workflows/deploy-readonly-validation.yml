name: Deploy Read-Only Validation

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-readonly-validation.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-readonly-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate diagnostic data and read-only contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate offline assets and cache lifecycle
        run: npm run validate:offline

      - name: Validate data
        run: node scripts/validate-data.js

      - name: Validate DTC CSV import
        run: node scripts/validate-verified-dtc-import.js

      - name: Validate OBD read-only contract
        run: node scripts/validate-obd-readonly.js

      - name: Validate local bridge contract
        run: node scripts/validate-local-bridge-readonly.js

      - name: Report DTC coverage
        run: node scripts/report-dtc-coverage.js

  windows-vendor-review:
    name: Validate non-executing driver review on Windows
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Inert temporary files and simulated process events only. No native
      # compilation, live registry discovery, vendor DLL loading or vehicle I/O.
      - name: Validate selected driver evidence and observation lifecycle
        run: node scripts/validate-vendor-review.js

  windows-workstation-package:
    name: Validate packaged workstation on Windows
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Builds temporary packages and generated preflight workers, exercises
      # Windows launchers and loopback HTTP, and queries fixed registry roots
      # read-only. No vendor DLL loading or VCI/vehicle communication.
      - name: Validate package integrity and guarded Windows entry points
        run: npm run validate:package

  scanner-browser:
    name: Validate offline scanner workflow in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/scanner-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/scanner-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Validate offline import, replay, recovery and export
        run: npm run validate:scanner-browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/scanner-browser/node_modules/playwright
          PLAYWRIGHT_CHANNEL: chromium
          TMPDIR: ${{ runner.temp }}

      - name: Validate saved multi-ECU archive after offline browser restart
        run: npm run validate:scanner-restart
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/scanner-browser/node_modules/playwright
          PLAYWRIGHT_CHANNEL: chromium
          TMPDIR: ${{ runner.temp }}

      - name: Validate fixed monitor preview offline
        run: node scripts/validate-monitor-preview-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/scanner-browser/node_modules/playwright
          PLAYWRIGHT_CHANNEL: chromium
          TMPDIR: ${{ runner.temp }}

      - name: Preserve synthetic test screenshots and runtime versions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scanner-workflow-screenshots
          path: |
            ${{ runner.temp }}/obd-file-flow-*/*.png
            ${{ runner.temp }}/obd-file-flow-*/browser-runtime.json
            ${{ runner.temp }}/monitor-preview-*/*.png
          if-no-files-found: warn
          retention-days: 7
